function App() {
  const [activeSetId, setActiveSetId] = useState(null);
  const [activeTab, setActiveTab] = useState('vocab');
  const [userAnswers, setUserAnswers] = useState({});
  const [examSubmitted, setExamSubmitted] = useState(false);
  const [timeLeft, setTimeLeft] = useState(80 * 60);
  const [timerRunning, setTimerRunning] = useState(false);
  const [showAnswerKey, setShowAnswerKey] = useState(false);
  const [finalScore, setFinalScore] = useState({ earned: 0, total: 80 });

  // Load progress from LocalStorage
  useEffect(() => {
    let savedState = null; try { savedState = localStorage.getItem('english_exam_progress'); } catch (e) {}
    if (savedState) {
      try {
        const parsed = JSON.parse(savedState);
        if (parsed.activeSetId) { setActiveSetId(parsed.activeSetId); if (!parsed.examSubmitted) setTimerRunning(true); }
        if (parsed.userAnswers) setUserAnswers(parsed.userAnswers);
        if (parsed.examSubmitted) setExamSubmitted(parsed.examSubmitted);
        if (parsed.timeLeft !== undefined) setTimeLeft(parsed.timeLeft);
        if (parsed.finalScore) setFinalScore(parsed.finalScore);
      } catch (e) {
        console.error("Failed to load saved state", e);
      }
    }
  }, []);

  // Save progress to LocalStorage
  useEffect(() => {
    const stateToSave = {
      activeSetId,
      userAnswers,
      examSubmitted,
      timeLeft,
      finalScore
    };
    try { localStorage.setItem('english_exam_progress', JSON.stringify(stateToSave)); } catch (e) {}
  }, [activeSetId, userAnswers, examSubmitted, timeLeft, finalScore]);

  // Timer Effect
  useEffect(() => {
    let timer = null;
    if (timerRunning && timeLeft > 0 && !examSubmitted) {
      timer = setInterval(() => {
        setTimeLeft((prev) => prev - 1);
      }, 1000);
    } else if (timeLeft === 0 && !examSubmitted && timerRunning) {
      handleAutoSubmit();
    }
    return () => {
      if (timer) clearInterval(timer);
    };
  }, [timerRunning, timeLeft, examSubmitted]);

  const activeSet = EXAM_DATABASE.find(s => s.id === activeSetId);

  const startExam = (setId) => {
    setActiveSetId(setId);
    setActiveTab('vocab');
    setUserAnswers({});
    setExamSubmitted(false);
    setTimeLeft(80 * 60);
    setTimerRunning(true);
    setShowAnswerKey(false);
  };

  const handleInputChange = (key, value) => {
    setUserAnswers(prev => ({
      ...prev,
      [key]: value
    }));
  };

  const calculateScore = () => {
    if (!activeSet) return { earned: 0, total: 80 };

    let earnedPoints = 0;
    const sec = activeSet.sections;

    // SECTION I: VOCABULARY (30 pts)
    // A. Matching (10 pts) -> 1 pt each
    if (sec.vocab.matching) {
      Object.entries(sec.vocab.matching.answers).forEach(([qId, corrAns]) => {
        const uAns = userAnswers[`matching_${qId}`];
        if (uAns && uAns.trim().toUpperCase() === corrAns.toUpperCase()) {
          earnedPoints += 1;
        }
      });
    }

    // B. Fill Paragraph (10 pts) -> 1 pt each
    if (sec.vocab.fillParagraph) {
      Object.entries(sec.vocab.fillParagraph.answers).forEach(([qId, corrAns]) => {
        const uAns = userAnswers[`fill_${qId}`];
        if (uAns && uAns.trim().toUpperCase() === corrAns.toUpperCase()) {
          earnedPoints += 1;
        }
      });
    }

    // C. Short Answer / MCQ (10 pts) -> 1 pt each
    if (sec.vocab.shortAnswer) {
      if (sec.vocab.shortAnswer.mcqFormat) {
        Object.entries(sec.vocab.shortAnswer.answers).forEach(([qId, corrAns]) => {
          const uAns = userAnswers[`vocab_mcq_${qId}`];
          if (uAns && uAns.trim().toUpperCase() === corrAns.toUpperCase()) {
            earnedPoints += 1;
          }
        });
      } else {
        sec.vocab.shortAnswer.answers.forEach((corrAns, idx) => {
          const uAns = userAnswers[`vocab_sa_${idx}`];
          if (uAns && uAns.trim().toLowerCase() === corrAns.toLowerCase()) {
            earnedPoints += 1;
          }
        });
      }
    }

    // SECTION II: GRAMMAR (30 pts)
    // A. Verb Forms / MCQ (10 pts)
    if (sec.grammar.verbForms) {
      if (sec.grammar.verbForms.mcqFormat) {
        Object.entries(sec.grammar.verbForms.answers).forEach(([qId, corrAns]) => {
          const uAns = userAnswers[`grammar_vf_mcq_${qId}`];
          if (uAns && uAns.trim().toUpperCase() === corrAns.toUpperCase()) {
            earnedPoints += 1;
          }
        });
      } else {
        sec.grammar.verbForms.answers.forEach((corrAns, idx) => {
          const uAns = userAnswers[`grammar_vf_${idx}`];
          if (uAns && uAns.trim().toLowerCase() === corrAns.toLowerCase()) {
            earnedPoints += 1;
          }
        });
      }
    }

    // B. MCQ (10 pts)
    if (sec.grammar.mcq) {
      Object.entries(sec.grammar.mcq.answers).forEach(([qId, corrAns]) => {
        const uAns = userAnswers[`grammar_mcq_${qId}`];
        if (uAns && uAns.trim().toUpperCase() === corrAns.toUpperCase()) {
          earnedPoints += 1;
        }
      });
    }

    // B/C Short Answer or Rearrange (10 pts)
    if (sec.grammar.shortAnswer) {
      sec.grammar.shortAnswer.answers.forEach((corrAns, idx) => {
        const uAns = userAnswers[`grammar_sa_${idx}`];
        if (uAns && uAns.trim().toLowerCase() === corrAns.toLowerCase()) {
          earnedPoints += 1;
        }
      });
    }

    if (sec.grammar.rearrange) {
      sec.grammar.rearrange.answers.forEach((corrAns, idx) => {
        const uAns = userAnswers[`grammar_re_${idx}`];
        const cleanU = (uAns || '').replace(/[\s\.]+/g, '').toLowerCase();
        const cleanC = corrAns.replace(/[\s\.]+/g, '').toLowerCase();
        if (cleanU && cleanU === cleanC) {
          earnedPoints += 1;
        }
      });
    }

    // SECTION III: READING (20 pts)
    if (sec.reading.type === 'tf') {
      sec.reading.answers.forEach((corrAns, idx) => {
        const uAns = userAnswers[`reading_tf_${idx}`];
        if (uAns && uAns.toUpperCase() === corrAns) {
          earnedPoints += 2; // 10 questions x 2 pts = 20 pts
        }
      });
    } else if (sec.reading.type === 'ordering_and_tf') {
      // Ordering 6 pts (1 pt each)
      if (sec.reading.orderingPart) {
        Object.entries(sec.reading.orderingPart.answers).forEach(([itemKey, corrAns]) => {
          const uAns = userAnswers[`reading_order_${itemKey}`];
          if (uAns && uAns.trim() === corrAns) {
            earnedPoints += 1;
          }
        });
      }
      // TF 14 pts (2 pts each)
      if (sec.reading.tfPart) {
        sec.reading.tfPart.answers.forEach((corrAns, idx) => {
          const uAns = userAnswers[`reading_tf_${idx}`];
          if (uAns && uAns.toUpperCase() === corrAns) {
            earnedPoints += 2;
          }
        });
      }
    }

    const n = (x) => (Array.isArray(x) ? x.length : Object.keys(x).length);
    let maxPts = 0;
    if (sec.vocab.matching) maxPts += n(sec.vocab.matching.answers);
    if (sec.vocab.fillParagraph) maxPts += n(sec.vocab.fillParagraph.answers);
    if (sec.vocab.shortAnswer) maxPts += n(sec.vocab.shortAnswer.answers);
    if (sec.grammar.verbForms) maxPts += n(sec.grammar.verbForms.answers);
    if (sec.grammar.mcq) maxPts += n(sec.grammar.mcq.answers);
    if (sec.grammar.shortAnswer) maxPts += n(sec.grammar.shortAnswer.answers);
    if (sec.grammar.rearrange) maxPts += n(sec.grammar.rearrange.answers);
    if (sec.reading.type === 'tf') maxPts += 2 * n(sec.reading.answers);
    else {
      if (sec.reading.orderingPart) maxPts += n(sec.reading.orderingPart.answers);
      if (sec.reading.tfPart) maxPts += 2 * n(sec.reading.tfPart.answers);
    }
    return { earned: earnedPoints, total: maxPts };
  };

  const handleAutoSubmit = () => {
    const scores = calculateScore();
    setFinalScore(scores);
    setExamSubmitted(true);
    setTimerRunning(false);
  };

  const resetExam = () => {
    setUserAnswers({});
    setExamSubmitted(false);
    setTimeLeft(80 * 60);
    setTimerRunning(true);
    setShowAnswerKey(false);
  };

  const formatTime = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  };

  const getWordCount = (text) => {
    if (!text) return 0;
    return text.trim().split(/\s+/).filter(Boolean).length;
  };

  // Check how many questions answered
  const getAnsweredCount = () => {
    if (!activeSet) return 0;
    return Object.keys(userAnswers).filter(k => userAnswers[k] && userAnswers[k].trim() !== '').length;
  };

  return (
    <div className="min-h-screen bg-slate-100 font-sans text-slate-900 pb-12 print:bg-white print:pb-0">
      
      {/* APP NAVBAR (Hidden when printing) */}
      <header className="sticky z-50 bg-slate-900 text-white shadow-md print:hidden">
        <div className="max-w-6xl mx-auto gutter py-3 flex flex-wrap justify-between items-center gap-4">
          <div 
            onClick={() => setActiveSetId(null)} 
            className="flex items-center gap-2 font-bold text-lg text-sky-400 cursor-pointer hover:text-sky-300 transition"
          >
            <BookOpen className="w-6 h-6" />
            <span>General English II Exam Portal</span>
          </div>

          {activeSet && (
            <div className="flex items-center gap-3">
              {/* Timer */}
              <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold ${timeLeft < 300 ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-800 text-amber-400 border border-slate-700'}`}>
                <Clock className="w-4 h-4" />
                <span>{formatTime(timeLeft)}</span>
              </div>

              {/* Show/Hide Answer Key */}
              <button 
                onClick={() => setShowAnswerKey(!showAnswerKey)}
                className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-200 transition"
              >
                {showAnswerKey ? <EyeOff className="w-4 h-4 text-emerald-400" /> : <Eye className="w-4 h-4 text-slate-400" />}
                <span>{showAnswerKey ? 'Hide Key' : 'Show Key'}</span>
              </button>

              {/* Back to Home */}
              <button 
                onClick={() => setActiveSetId(null)}
                className="flex items-center gap-1.5 bg-sky-600 hover:bg-sky-500 px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition"
              >
                <ArrowLeft className="w-4 h-4" />
                <span>All Sets</span>
              </button>
            </div>
          )}
        </div>
      </header>

      {/* VIEW 1: HOME PAGE / SET SELECTOR */}
      {!activeSetId && (
        <main className="max-w-5xl mx-auto gutter py-8">
          <div className="text-center mb-10">
            <h1 className="text-3xl font-extrabold text-slate-900 mb-2">Final Examination Practice System</h1>
            <p className="text-slate-600 max-w-2xl mx-auto text-sm">
              Complete English practice system containing all 7 authentic exam papers (Units 7–12) with auto-grading, timing, and print support.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {EXAM_DATABASE.map((set) => (
              <div 
                key={set.id}
                className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm hover:shadow-md hover:border-sky-500 transition cursor-pointer flex flex-col justify-between group"
                onClick={() => startExam(set.id)}
              >
                <div>
                  <div className="flex justify-between items-start mb-3">
                    <span className="bg-sky-100 text-sky-800 text-xs font-bold px-2.5 py-1 rounded-md">
                      {set.subtitle}
                    </span>
                    <span className="text-xs font-semibold text-slate-500 flex items-center gap-1">
                      <Clock className="w-3.5 h-3.5" /> {set.duration} mins

                                userVal === opt 
                                  ? (examSubmitted 
                                      ? (isCorrect ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-red-600 text-white border-red-600')
                                      : 'bg-sky-600 text-white border-sky-600')
                                  : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'
                              }`}
                            >
                              {opt}
                            </button>
                          ))}
                          {examSubmitted && (
                            <span className="text-xs font-bold text-emerald-700 ml-2">[{corrVal}]</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Ordering and TF Combination Type (Sets 5, 6, 7) */}
              {activeSet.sections.reading.type === 'ordering_and_tf' && (
                <div className="space-y-6">
                  {/* Part A: Ordering */}
                  {activeSet.sections.reading.orderingPart && (
                    <div>
                      <p className="font-bold text-sm text-slate-900 mb-2">{activeSet.sections.reading.orderingPart.instruction}</p>
                      
                      {activeSet.sections.reading.orderingPart.passage && (
                        <div className="bg-amber-50/60 border-l-4 border-amber-400 p-4 rounded-r-md mb-3">
                          <h4 className="font-bold text-sm text-amber-900 mb-1">{activeSet.sections.reading.orderingPart.passageTitle}</h4>
                          <p className="text-xs leading-relaxed text-slate-800">{activeSet.sections.reading.orderingPart.passage}</p>
                        </div>
                      )}

                      <div className="space-y-2">
                        {activeSet.sections.reading.orderingPart.items.map((itemText, idx) => {
                          const itemKey = itemText.match(/([A-F])\./)?.[1] || idx;
                          const userVal = userAnswers[`reading_order_${itemKey}`] || '';
                          const corrVal = activeSet.sections.reading.orderingPart.answers[itemKey];
                          const isCorrect = examSubmitted && userVal === corrVal;

                          return (
                            <div key={idx} className="flex items-center gap-3 text-xs font-medium text-slate-800">
                              <input 
                                type="text"
                                maxLength={1}
                                value={userVal}
                                onChange={(e) => handleInputChange(`reading_order_${itemKey}`, e.target.value)}
                                disabled={examSubmitted}
                                placeholder="#"
                                className={`w-8 h-8 text-center font-bold text-xs border rounded outline-none ${
                                  isCorrect ? 'bg-emerald-100 border-emerald-500 text-emerald-900' :
                                  'border-slate-300 focus:border-sky-500'
                                }`}
                              />
                              <span className="flex-1">{itemText}</span>
                              {examSubmitted && (
                                <span className="font-bold text-emerald-700">[{corrVal}]</span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Part B: TF */}
                  {activeSet.sections.reading.tfPart && (
                    <div className="pt-4 border-t border-slate-200">
                      <p className="font-bold text-sm text-slate-900 mb-3">{activeSet.sections.reading.tfPart.instruction}</p>
                      
                      {activeSet.sections.reading.tfPart.passage && (
                        <div className="bg-amber-50/60 border-l-4 border-amber-400 p-4 rounded-r-md mb-4">
                          <h4 className="font-bold text-sm text-amber-900 mb-1">{activeSet.sections.reading.tfPart.passageTitle}</h4>
                          {activeSet.sections.reading.tfPart.passage.split('\n\n').map((p, pIdx) => (
                            <p key={pIdx} className="text-xs leading-relaxed text-slate-800 mb-2">{p}</p>
                          ))}
                        </div>
                      )}

                      <div className="space-y-3">
                        {activeSet.sections.reading.tfPart.statements.map((stmt, idx) => {
                          const userVal = userAnswers[`reading_tf_${idx}`] || '';
                          const corrVal = activeSet.sections.reading.tfPart.answers[idx];
                          const isCorrect = examSubmitted && userVal === corrVal;

                          return (
                            <div key={idx} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm border-b border-slate-100 pb-2">
                              <span className="font-medium text-slate-800 flex-1">{stmt}</span>
                              <div className="flex items-center gap-2">
                                {["T", "F"].map(opt => (
                                  <button
                                    key={opt}
                                    type="button"
                                    onClick={() => handleInputChange(`reading_tf_${idx}`, opt)}
                                    disabled={examSubmitted}
                                    className={`px-3 py-1 text-xs font-bold rounded border transition ${
                                      userVal === opt 
                                        ? (examSubmitted 
                                            ? (isCorrect ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-red-600 text-white border-red-600')
                                            : 'bg-sky-600 text-white border-sky-600')
                                        : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'
                                    }`}
                                  >
                                    {opt}
                                  </button>
                                ))}
                                {examSubmitted && (
                                  <span className="text-xs font-bold text-emerald-700 ml-2">[{corrVal}]</span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* SECTION IV: WRITING */}
            <div className={`space-y-6 ${activeTab === 'writing' ? 'block' : 'hidden print:block'}`}>
              <h2 className="text-base font-bold bg-slate-100 text-sky-900 border-l-4 border-sky-600 px-3 py-1.5 uppercase">
                {activeSet.sections.writing.title}
              </h2>

              <p className="font-bold text-sm text-slate-900">{activeSet.sections.writing.instruction}</p>

              {/* Topics Options */}
              <div className="space-y-3">
                {activeSet.sections.writing.topics.map(t => (
                  <div key={t.id} className="p-3 border border-slate-200 rounded-md bg-slate-50">
                    <h4 className="font-bold text-xs text-sky-900 mb-1">{t.title}</h4>
                    <p className="text-xs text-slate-700 leading-relaxed">{t.desc}</p>
                  </div>
                ))}
              </div>

              {/* Writing Text Area */}
              <div className="pt-2">
                <div className="flex justify-between items-center mb-1">
                  <label className="font-bold text-xs text-slate-700">Write your paragraph below:</label>
                  <span className={`text-xs font-semibold ${getWordCount(userAnswers['writing_text']) > 150 ? 'text-emerald-600' : 'text-slate-500'}`}>
                    Word count: {getWordCount(userAnswers['writing_text'])} / ~150 words
                  </span>
                </div>
                <textarea
                  rows={8}
                  value={userAnswers['writing_text'] || ''}
                  onChange={(e) => handleInputChange('writing_text', e.target.value)}
                  disabled={examSubmitted}
                  placeholder="Type your essay paragraph here..."
                  className="w-full p-3 border border-slate-300 rounded-md text-xs leading-relaxed outline-none focus:border-sky-500"
                />
              </div>
            </div>

            {/* SUBMIT BUTTON FOOTER (Hidden in Print) */}
            {!examSubmitted && (
              <div className="mt-8 pt-6 border-t border-slate-200 flex justify-between items-center print:hidden">
                <div className="text-xs text-slate-500">
                  Answered: <strong>{getAnsweredCount()}</strong> inputs
                </div>
                <button 
                  onClick={handleAutoSubmit}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow-sm transition flex items-center gap-2"
                >
                  <CheckCircle className="w-4 h-4" /> Finish & Submit Exam
                </button>
              </div>
            )}

            {/* EMBEDDED ANSWER KEY BOX (Shown when toggled or submitted) */}
            {(showAnswerKey || examSubmitted) && (
              <div className="mt-12 pt-6 border-t-2 border-dashed border-emerald-500 bg-emerald-50/40 p-6 rounded-lg text-xs leading-relaxed space-y-4 print:block">
                <h3 className="font-black text-sm text-emerald-900 uppercase tracking-wide border-b border-emerald-200 pb-2">
                  {activeSet.answerKeyTitle}
                </h3>

                {/* Section I Keys */}
                <div>
                  <h4 className="font-bold text-emerald-800 uppercase mb-1">SECTION I: VOCABULARY</h4>
                  {activeSet.sections.vocab.matching && (
                    <p><strong>A. Matching:</strong> {Object.entries(activeSet.sections.vocab.matching.answers).map(([k, v]) => `${k}-${v}`).join(' | ')}</p>
                  )}
                  {activeSet.sections.vocab.fillParagraph && (
                    <p><strong>B. Fill in blanks:</strong> {Object.entries(activeSet.sections.vocab.fillParagraph.answers).map(([k, v]) => `${k}-${v}`).join(' | ')}</p>
                  )}
                  {activeSet.sections.vocab.shortAnswer && (
                    <p><strong>C. Answers:</strong> {
                      activeSet.sections.vocab.shortAnswer.mcqFormat 
                        ? Object.entries(activeSet.sections.vocab.shortAnswer.answers).map(([k, v]) => `${k}-${v}`).join(' | ')
                        : activeSet.sections.vocab.shortAnswer.answers.join(' | ')
                    }</p>
                  )}
                </div>

                {/* Section II Keys */}
                <div>
                  <h4 className="font-bold text-emerald-800 uppercase mb-1">SECTION II: GRAMMAR</h4>
                  {activeSet.sections.grammar.verbForms && (
                    <p><strong>A. Verb Forms:</strong> {
                      activeSet.sections.grammar.verbForms.mcqFormat
                        ? Object.entries(activeSet.sections.grammar.verbForms.answers).map(([k, v]) => `${k}-${v}`).join(' | ')
                        : activeSet.sections.grammar.verbForms.answers.join(' | ')
                    }</p>
                  )}
                  {activeSet.sections.grammar.mcq && (
                    <p><strong>B. Multiple Choice:</strong> {Object.entries(activeSet.sections.grammar.mcq.answers).map(([k, v]) => `${k}-${v}`).join(' | ')}</p>
                  )}
                  {activeSet.sections.grammar.rearrange && (
                    <div>
                      <strong>C. Rearrange:</strong>
                      <ol className="list-decimal pl-4 mt-1 space-y-0.5">
                        {activeSet.sections.grammar.rearrange.answers.map((ans, idx) => (
                          <li key={idx}>{ans}</li>
                        ))}
                      </ol>
                    </div>
                  )}
                  {activeSet.sections.grammar.shortAnswer && (
                    <p><strong>B. Answers:</strong> {activeSet.sections.grammar.shortAnswer.answers.join(' | ')}</p>
                  )}
                </div>

                {/* Section III Keys */}
                <div>
                  <h4 className="font-bold text-emerald-800 uppercase mb-1">SECTION III: READING</h4>
                  {activeSet.sections.reading.type === 'tf' && (
                    <p>{activeSet.sections.reading.answers.map((ans, idx) => `${idx + 1}-${ans}`).join(' | ')}</p>
                  )}
                  {activeSet.sections.reading.type === 'ordering_and_tf' && (
                    <div>
                      {activeSet.sections.reading.orderingPart && (
                        <p><strong>A. Ordering:</strong> {Object.entries(activeSet.sections.reading.orderingPart.answers).map(([k, v]) => `${k}-${v}`).join(' | ')}</p>
                      )}
                      {activeSet.sections.reading.tfPart && (
                        <p><strong>B. True/False:</strong> {activeSet.sections.reading.tfPart.answers.map((ans, idx) => `${idx + 1}-${ans}`).join(' | ')}</p>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

          </div>
        </main>
      )}

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</html>
